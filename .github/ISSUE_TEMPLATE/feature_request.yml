name: 功能建议
description: 建议新工具或体验改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、输入、输出和移动端表现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 参考实现或替代方案
      description: 可提供成熟开源项目链接，并说明其许可证。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
